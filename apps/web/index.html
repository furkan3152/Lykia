<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Lykia — the policy layer for money that agents and apps move</title>
    <meta
      name="description"
      content="Say the outcome; Lykia compiles it into a route across Arc protocols and Circle rails, the Fence checks every step against your rules, and you or your agent sign it. The same engine is an API for every builder. Built on Arc Network, powered by Circle."
    />
    <meta name="theme-color" content="#13233A" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lykia" />
    <meta property="og:title" content="Lykia — the policy layer for money that agents and apps move" />
    <meta
      property="og:description"
      content="Say the outcome, get a route across Arc protocols and Circle rails, checked against your Fence. Non-custodial, live on Arc mainnet in beta."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("lykia-ui");
          var state = raw ? JSON.parse(raw).state : null;
          if (state && state.motion === "off") document.documentElement.setAttribute("data-motion", "off");
        } catch (error) {}
      })();
    </script>
    <style>
      html { background-color: #f1e8d4; }
    </style>
    <!--
      Latin web fonts, fetched while the entry loads so headings paint in their
      final face. The build fingerprints these hrefs to the same files the
      @fontsource stylesheets reference (src/styles/fonts.css); the dev server
      cannot serve them at these paths, so nothing is preloaded under it.
    -->
    <template id="el-font-preloads">
      <link rel="preload" as="font" type="font/woff2" crossorigin href="../../node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-700-normal.woff2" />
      <link rel="preload" as="font" type="font/woff2" crossorigin href="../../node_modules/@fontsource/silkscreen/files/silkscreen-latin-400-normal.woff2" />
      <link rel="preload" as="font" type="font/woff2" crossorigin href="../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2" />
    </template>
    <script>
      (function () {
        if (document.querySelector('script[src$="/@vite/client"]')) return;
        var template = document.getElementById("el-font-preloads");
        var links = template && template.content ? template.content.querySelectorAll("link") : [];
        for (var i = 0; i < links.length; i += 1) document.head.appendChild(links[i].cloneNode(true));
      })();
    </script>
  </head>
  <body>
    <noscript>Lykia needs JavaScript to draw the valley, read Arc live and let you sign each step in your own wallet.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
