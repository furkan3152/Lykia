name: Bug report
description: Report something that does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call ...
        2. With ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [API, Web app, SDK, Widget or embed, Contracts, Docs, Other]
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Arc mainnet, Arc testnet, Local]
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Request ids, transaction hashes, logs or screenshots. Never paste private keys or API secrets.
