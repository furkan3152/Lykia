# Render Blueprint for the Lykia API (apps/api) as a persistent Node web service.
# Values are never committed: every key with `sync: false` is filled in the
# Render dashboard (Environment) when the Blueprint is applied.
# The web app (apps/web) stays on Vercel; point LYKIA_WEB_ORIGIN at it and set
# VITE_API_URL in the web project to this service's URL.
services:
  - type: web
    name: lykia-api
    runtime: node
    plan: starter            # always on: schedulers need a process that does not sleep
    region: frankfurt
    rootDir: .               # build from the workspace root (npm workspaces)
    buildCommand: npm ci && npm run build:api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: LYKIA_MODE
        value: mainnet
      - key: LYKIA_TRUST_PROXY
        value: "1"
      # Postgres (Neon or Render Postgres). DATABASE_URL / POSTGRES_URL also work; this one wins.
      - key: LYKIA_DATABASE_URL
        sync: false
      - key: LYKIA_SESSION_SECRET
        sync: false
      - key: LYKIA_WEB_ORIGIN
        sync: false
      - key: LYKIA_SIWE_DOMAINS
        sync: false
      - key: LYKIA_ADMIN_ADDRESSES
        sync: false
      # Protocol fee: 100 bps = 1% by default, capped at 300.
      - key: LYKIA_FEE_BPS
        sync: false
      - key: LYKIA_FEE_RECIPIENT
        sync: false
      - key: ARC_MAINNET_RPC_URL
        sync: false
      - key: ARC_TESTNET_RPC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LYKIA_AGENT_MODEL
        sync: false
      - key: CIRCLE_API_KEY
        sync: false
      - key: CIRCLE_ENTITY_SECRET
        sync: false
      - key: CIRCLE_WALLET_SET_ID
        sync: false
      - key: STABLEFX_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: LYKIA_X402_PAY_TO
        sync: false
      - key: LYKIA_X402_PRICE_USDC
        sync: false
      - key: LYKIA_X402_FACILITATOR_URL
        sync: false
      - key: LYKIA_GUARD_ADDRESS
        sync: false
      - key: LYKIA_KEEPER_PRIVATE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: LYKIA_LOG_LEVEL
        sync: false
