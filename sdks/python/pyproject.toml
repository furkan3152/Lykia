[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lykia"
version = "0.1.0"
description = "Python client for the Lykia API, built on Arc Network: plans, the Fence, agents, keys, webhooks, logs and billing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1"]
keywords = ["lykia", "arc", "circle", "usdc", "stablecoin", "agents", "webhooks"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Typing :: Typed"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://lykiaai.com/mint"
Repository = "https://github.com/furkan3152/lykia"

[tool.hatch.build.targets.wheel]
packages = ["lykia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
